[package]
name = "echoprism-core"
version = "0.1.0"
edition = "2021"
description = "Core types and traits for EchoPrism"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
bytes = "1.5"
futures = "0.3"
pin-project = "1.1"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
