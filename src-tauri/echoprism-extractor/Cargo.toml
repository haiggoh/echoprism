[package]
name = "echoprism-extractor"
version = "0.1.0"
edition = "2021"
description = "Video extraction using yt-dlp and Invidious/Piped APIs"

[dependencies]
echoprism-core = { path = "../echoprism-core" }
tokio = { version = "1.38", features = ["full"] }
tokio-process = "0.2"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
pin-project = "1.1"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
url = "2.5"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
flume = "0.11"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
url = "2.5"
percent-encoding = "2.3"
percent-encoding = "2.3"
base64 = "0.23"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
