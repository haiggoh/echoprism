<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EchoPrism embed player</title>
<style>html,body{margin:0;height:100%;background:#000}#player{width:100%;height:100%}</style>
</head>
<body>
<div id="player"></div>
<script>
  // Task 5 ad blocking (json-prune pattern). MUST run before the IFrame API
  // loads so its own requests are wrapped. Keep in sync with src/lib/adPrune.ts
  // (the unit-tested copy).
  (function () {
    var AD_KEYS = { adPlacements: 1, playerAds: 1, adSlots: 1 };
    function prune(v) {
      if (Array.isArray(v)) return v.map(prune);
      if (v && typeof v === 'object') {
        var out = {};
        for (var k in v) { if (!AD_KEYS[k]) out[k] = prune(v[k]); }
        return out;
      }
      return v;
    }
    function pruneText(text) {
      var obj;
      try { obj = JSON.parse(text); } catch (e) { return text; }
      if (!obj || typeof obj !== 'object') return text;
      if (!('ytInitialPlayerResponse' in obj) && !('playabilityStatus' in obj) && !('playerAds' in obj)) return text;
      return JSON.stringify(prune(obj));
    }
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      return origFetch.apply(this, arguments).then(function (resp) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (!/youtubei\/v1\/player|youtube-nocookie\.com|youtube\.com/.test(url)) return resp;
        return resp.text().then(function (t) {
          return new Response(pruneText(t), { status: resp.status, statusText: resp.statusText, headers: resp.headers });
        });
      });
    };
    var origOpen = XMLHttpRequest.prototype.open;
    var origSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (method, url) {
      this.__epUrl = String(url);
      return origOpen.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () {
      var self = this;
      if (/youtubei\/v1\/player|youtube-nocookie\.com|youtube\.com/.test(self.__epUrl || '')) {
        var origText = Object.getOwnPropertyDescriptor(XMLHttpRequest.prototype, 'responseText');
        Object.defineProperty(self, 'responseText', {
          configurable: true,
          get: function () { return pruneText(origText.get.call(self)); },
        });
      }
      return origSend.apply(this, arguments);
    };
  })();
</script>
<script src="https://www.youtube-nocookie.com/iframe_api"></script>
<script>
  // Task 5 host page. It is served from the app's OWN proxy origin
  // (http://127.0.0.1:<port>), so the IFrame API's requests to YouTube carry a
  // valid 127.0.0.1 referrer — the §11 spike showed a page without one gets
  // error 153. The app's tauri:// origin is never involved.
  var player = null;
  function post(msg) {
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: '',
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function () { post({ type: 'ready' }); },
        onStateChange: function (e) { post({ type: 'state', state: e.data }); },
        onError: function (e) { post({ type: 'error', code: e.data }); },
      },
    });
  };
  setInterval(function () {
    if (player && typeof player.getCurrentTime === 'function') {
      try {
        var t = player.getCurrentTime();
        if (typeof t === 'number') post({ type: 'time', t: t });
      } catch (e) { /* player not ready yet */ }
    }
  }, 500);
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || typeof m !== 'object' || !player) return;
    switch (m.cmd) {
      case 'load':
        if (m.autoplay) player.loadVideoById(m.videoId); else player.cueVideoById(m.videoId);
        break;
      case 'play': player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'seek': player.seekTo(m.t, true); break;
    }
  });
</script>
</body>
</html>
