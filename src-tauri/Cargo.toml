[package]
name = "echoprism"
version = "0.1.0"
description = "EchoPrism - Two streams become one"
authors = ["EchoPrism Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/echoprism/echoprism"

[workspace]
members = [
  "echoprism-core",
  "echoprism-extractor",
  "echoprism-matcher",
  "echoprism-podcast",
  "echoprism-sponsorblock",
  "echoprism-instance-pool",
]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
echoprism-core = { path = "echoprism-core" }
tauri = { version = "2.0", features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-store = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-media-session = "0.2"
tauri-plugin-clipboard = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = "2.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
tokio-process = "0.2"
bytes = "1.5"
futures = "0.3"
pin-project = "1.1"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
url = "2.5"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
flume = "0.11"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
config = "0.14"
dirs = "5.0"
notify = "6.1"
walkdir = "2.3"
ignore = "0.4"
glob = "0.3"
regex = "1.10"
fuzzy-matcher = "0.3.7"
stop-words = "0.5"
rss = "2.0"
base64 = "0.23"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1.6"
argon2 = "0.5"
bcrypt = "0.15"
jsonwebtoken = "9.2"
http = "1.0"
mime = "0.3"
percent-encoding = "2.3"
form_urlencoded = "1.2"
tempfile = "3.8"
roxmltree = "0.19"
