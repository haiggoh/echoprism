[package]
name = "echoprism"
version = "0.1.0"
description = "EchoPrism - Two streams become one"
authors = ["EchoPrism Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/echoprism/echoprism"

[workspace]
members = [
  "echoprism-core",
  "echoprism-extractor",
  "echoprism-matcher",
  "echoprism-podcast",
  "echoprism-sponsorblock",
  "echoprism-instance-pool",
]

[dependencies]
tauri = { version = "2.0", features = [
  "shell",
  "dialog",
  "fs",
  "opener",
  "store",
  "window-state",
  "clipboard-manager",
  "global-shortcut",
  "notification",
  "http",
  "tray-icon",
  "media-session",
  "clipboard",
  "single-instance",
  "updater",
  "protocol",
] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
url = "2.5"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
rusqlite = { version = "0.31", features = ["bundled", "serde_json", "chrono", "extra_check"] }
yt-dlp = "0.1"  # hypothetical - would use command-line yt-dlp
flume = "0.11"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
config = "0.14"
dirs = "5.0"
notify = "6.1"
walkdir = "2.3"
ignore = "0.4"
glob = "0.3"
regex = "1.10"
fuzzy_matcher = "0.4"
levenshtein = "0.3"
stop_words = "0.1"
stemmer = "0.1"
tf_idf = "0.1"
html-escape = "0.2"
ammonia = "4.0"
rss = "2.0"
atom_syndication = "0.8"
quick-xml = "0.31"
base64 = "0.23"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1.6"
argon2 = "0.5"
bcrypt = "0.15"
jsonwebtoken = "9.2"
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.0", features = ["full"] }
http = "1.0"
mime = "0.3"
percent-encoding = "2.3"
form_urlencoded = "1.2"
multipart = "0.19"
bytes = "1.5"
futures = "0.3"
pin-project = "1.1"
async-trait = "0.1"
mockall = { version = "0.12", features = ["nightly"] }
proptest = "1.0"
rstest = "0.18"
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
