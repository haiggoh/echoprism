[package]
name = "echoprism-matcher"
version = "0.1.0"
edition = "2021"
description = "Smart Episode Linking - matches podcast episodes to YouTube videos"

[dependencies]
echoprism-core = { path = "../echoprism-core" }
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
pin-project = "1.1"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
url = "2.5"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
fuzzy_matcher = "0.4"
levenshtein = "0.3"
stop_words = "0.1"
stemmer = "0.1"
tf_idf = "0.1"
