<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- EchoPrism dock icon (owner redesign 2026-10-18).
       Layer 1: the brand gradient square (same shape/colors as the sidebar
       mark square: orange video top-left -> teal audio bottom-right).
       Layer 2: the app's dark surface as an inner panel, so the prism keeps
       full contrast (beam colors would blend into a same-hue gradient).
       Layer 3: the prism mark — the exact PrismLogo geometry (120x64
       viewBox) scaled x4.22, centered in the panel. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#00D4C8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="256" fill="url(#brand)"/>
  <rect x="160" y="160" width="704" height="704" rx="160" fill="#0A0E1A"/>

  <g transform="translate(258 377) scale(4.22)" fill="none">
    <polygon points="60,8 104,56 16,56" stroke="rgba(255,255,255,0.88)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 4 26 L 66 26 L 76 36 L 116 36" stroke="#00D4C8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 4 38 L 66 38 L 76 28 L 116 28" stroke="#FF8C42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="84" y1="32" x2="114" y2="32" stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
  </g>
</svg>
